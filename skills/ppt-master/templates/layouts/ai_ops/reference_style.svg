  <rect x="270" y="215" width="140" height="35" fill="#FFFFFF" stroke="#F2F2F2" stroke-width="2" />
  <text x="340" y="239" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, sans-serif" font-size="14" font-weight="bold" fill="#000000" text-anchor="middle">IT訂單自愈<tspan fill="#C00000">69w</tspan></text>
  
