<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <!-- Background -->
  <rect x="0" y="0" width="1280" height="720" fill="#ffffff" />
  
  <!-- Header -->
  <rect x="30" y="20" width="10" height="40" fill="#C00000" />
  <text x="50" y="55" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, sans-serif" font-size="36" font-weight="bold" fill="#C00000">1 公司運維AI建設總體檢視</text>
  
  <!-- Subtitle -->
  <rect x="30" y="80" width="1220" height="60" fill="#F2F2F2" />
  <text x="640" y="105" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, sans-serif" font-size="16" font-weight="bold" fill="#000000" text-anchor="middle">
    <tspan x="640" dy="0">聚焦使用者故障壓降，提升最佳化一鍵診斷能力，實現降本提質；深入系統架構具備一鍵故障定位；藉助大數據核心網實現網路效能提升；通過能</tspan>
    <tspan x="640" dy="25">力封裝、跨域拉通、知識沉澱、智慧編排、開放共享等五大舉措，深化AI大模型應用，重塑故障診斷處置流程，做深做實1-5-10</tspan>
  </text>
  
  <!-- Large Triangle Background (simplified to a polygon) -->
  <polygon points="640,160 30,340 1250,340" fill="#F8CBAD" fill-opacity="0.3" stroke="none" />
  
  <!-- Target Bar -->
