  <text x="640" y="188" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">以故障雙壓降，快速定位故障問題為目標</text>

