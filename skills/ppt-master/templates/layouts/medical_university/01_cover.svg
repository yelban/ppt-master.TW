<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <!-- 背景 -->
    <rect width="1280" height="720" fill="#FFFFFF" />

    <!-- ==================== 頂部裝飾區域 ==================== -->
    <!-- 醫學藍主橫條 -->
    <rect x="0" y="0" width="1280" height="100" fill="#0066B3" />
    <!-- 左側橙色豎條裝飾 -->
    <rect x="0" y="0" width="6" height="100" fill="#FF6B35" />

    <!-- 頂部裝飾：心電圖波形線（醫療元素） -->
    <path d="M40 50 L100 50 L120 20 L140 80 L160 40 L180 60 L200 50 L280 50" stroke="#FFFFFF" stroke-width="2"
        stroke-opacity="0.3" fill="none" />

    <!-- 右上角 Logo/校徽區域佔位 -->
    <rect x="1080" y="25" width="160" height="50" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.3"
        rx="4" />
    <text x="1160" y="58" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, Arial, sans-serif"
        font-size="16" font-weight="bold">
        {{LOGO}}
    </text>

    <!-- ==================== 主內容區域 ==================== -->
    <!-- 主標題 -->
    <text x="640" y="320" text-anchor="middle" fill="#004080" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, Arial, sans-serif"
        font-size="52" font-weight="bold">
        {{TITLE}}
    </text>

    <!-- 副標題 -->
    <text x="640" y="385" text-anchor="middle" fill="#666666" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, Arial, sans-serif"
        font-size="26">
        {{SUBTITLE}}
    </text>

    <!-- 裝飾分割線 -->
    <line x1="420" y1="425" x2="860" y2="425" stroke="#0066B3" stroke-width="2" />
    <circle cx="640" cy="425" r="6" fill="#00A86B" />
    <!-- 左右裝飾小圓點 -->
    <circle cx="420" cy="425" r="4" fill="#0066B3" />
    <circle cx="860" cy="425" r="4" fill="#0066B3" />

    <!-- ==================== 彙報人資訊區域 ==================== -->
    <!-- 彙報人 -->
    <text x="640" y="490" text-anchor="middle" fill="#333333" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, Arial, sans-serif"
        font-size="22">
        彙報人：{{AUTHOR}}
    </text>

    <!-- 科室/導師 -->
    <text x="640" y="528" text-anchor="middle" fill="#666666" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, Arial, sans-serif"
        font-size="18">
        {{DEPARTMENT}}　｜　指導老師：{{ADVISOR}}
    </text>

    <!-- 機構名稱 -->
    <text x="640" y="570" text-anchor="middle" fill="#0066B3" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, Arial, sans-serif"
        font-size="20" font-weight="bold">
        {{INSTITUTION}}
    </text>

    <!-- ==================== 底部資訊 ==================== -->
    <rect x="0" y="665" width="1280" height="55" fill="#F5F7FA" />
    <!-- 底部裝飾線 -->
    <rect x="0" y="665" width="1280" height="3" fill="#0066B3" />
    <text x="640" y="700" text-anchor="middle" fill="#999999" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, Arial, sans-serif"
        font-size="14">
        {{DATE}}
    </text>
</svg>