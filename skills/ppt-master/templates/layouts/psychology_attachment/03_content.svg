<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
    <!-- 背景 -->
    <rect width="1280" height="720" fill="#F8FAFC" />

    <!-- 左側裝飾條 -->
    <rect x="0" y="0" width="8" height="720" fill="#2E5C8E" />

    <!-- 標題區域 -->
    <text x="60" y="75" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, sans-serif" font-size="28" font-weight="bold"
        fill="#1E293B">
        {{PAGE_TITLE}}
    </text>
    <text x="60" y="105" font-family="system-ui, sans-serif" font-size="16" fill="#64748B">
        {{TITLE_EN}}
    </text>

    <!-- 分隔線 -->
    <line x1="60" y1="125" x2="500" y2="125" stroke="#E5E7EB" stroke-width="2" />

    <!-- ==================== 內容區域 ==================== -->
    <!-- 
    AI 靈活佈局區
    可用空間: x=60, y=140, width=1180, height=490
    請根據實際內容選擇合適的佈局模式：
    - 三欄並列（每欄 360px + 間距 40px）
    - 左右分欄（左 560px + 間距 60px + 右 580px）
    - 垂直堆疊（層級結構）
    - 四格對比（依戀型別）
    - 單欄居中
  -->
    <rect x="60" y="140" width="1180" height="490" fill="none" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="8,4"
        rx="8" />
    <text x="650" y="390" text-anchor="middle" fill="#CBD5E1" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, sans-serif"
        font-size="14">
        {{CONTENT_AREA}}
    </text>

    <!-- 頁碼 -->
    <text x="1220" y="700" font-family="system-ui, sans-serif" font-size="14" fill="#9CA3AF"
        text-anchor="end">{{PAGE_NUM}}</text>
</svg>
