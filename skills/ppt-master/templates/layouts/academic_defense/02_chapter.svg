<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- 背景：全屏深藍，營造過渡感和沉浸感 -->
  <rect width="1280" height="720" fill="#003366"/>
  
  <!-- 背景裝飾：右側幾何圖形，增加層次 -->
  <path d="M800 0 L1280 0 L1280 720 L600 720 Z" fill="#004080" fill-opacity="0.3"/>
  <rect x="1200" y="0" width="80" height="720" fill="#002244" fill-opacity="0.2"/>
  
  <!-- 左側紅色裝飾條 -->
  <rect x="0" y="240" width="12" height="240" fill="#CC0000"/>
  
  <!-- ==================== 章節資訊區域 ==================== -->
  <!-- 章節編號：大號數字，半透明背景字 -->
  <text x="120" y="480" fill="#FFFFFF" fill-opacity="0.08" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, Arial, sans-serif" font-size="280" font-weight="bold">
    {{CHAPTER_NUM}}
  </text>
  
  <!-- 章節標題：醒目白色 -->
  <text x="380" y="340" fill="#FFFFFF" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, Arial, sans-serif" font-size="56" font-weight="bold">
    {{CHAPTER_TITLE}}
  </text>
  
  <!-- 章節描述/摘要：淺灰色 -->
  <text x="380" y="410" fill="#E8F4FC" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, Arial, sans-serif" font-size="24">
    {{CHAPTER_DESC}}
  </text>
  
  <!-- 裝飾線條 -->
  <line x1="380" y1="265" x2="500" y2="265" stroke="#CC0000" stroke-width="6"/>
  
  <!-- 底部資訊 -->
  <text x="1240" y="680" text-anchor="end" fill="#FFFFFF" fill-opacity="0.4" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, Arial, sans-serif" font-size="18">
    {{TITLE}}
  </text>
</svg>
