<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 720">
    <!-- 模板: 內容頁 - 中汽研風格 -->

    <!-- 白色背景 -->
    <rect x="0" y="0" width="1280" height="720" fill="#FFFFFF" />

    <!-- 頂部深藍色裝飾線 -->
    <rect x="0" y="0" width="1280" height="4" fill="#004098" />

    <!-- 頁首導航欄 -->
    <!-- 章節序號塊 - 深藍色正方形 -->
    <rect x="60" y="30" width="50" height="50" fill="#004098" />
    <text x="85" y="65" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold"
        fill="#FFFFFF">{{CHAPTER_NUM}}</text>

    <!-- 頁面標題 -->
    <text x="130" y="65" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, sans-serif" font-size="28" font-weight="bold"
        fill="#333333">{{PAGE_TITLE}}</text>

    <!-- 右上角Logo -->
    <image href="../images/{{LOGO_HEADER}}" x="1107" y="30" width="113" height="50"
        preserveAspectRatio="xMidYMid meet" />

    <!-- 內容區域 - 靈活佈局，由 Executor 根據實際內容自由設計 -->
    <!-- 可使用的佈局模式：
       - 單欄文字列表
       - 左右雙欄對比
       - 卡片式分塊（如 2×2 四宮格）
       - 圖文混排（左圖右文、上圖下文、通欄圖）
       - 表格
       - 時間軸
       - 流程圖
  -->
    <rect x="60" y="100" width="1160" height="570" fill="none" stroke="#E0E0E0" stroke-width="2"
        stroke-dasharray="8,8" />
    <text x="640" y="365" text-anchor="middle" fill="#CBD5E1" font-size="18" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, sans-serif">
        {{CONTENT_AREA}}
    </text>
    <text x="640" y="400" text-anchor="middle" fill="#CBD5E1" font-size="14" font-family="Microsoft JhengHei, PingFang TC, Noto Sans TC, GenSekiGothic2TW, sans-serif">
        (由 Executor 根據實際內容自由佈局)
    </text>

    <!-- 常用設計元素參考 -->
    <!-- 色塊容器: <rect fill="#F5F5F5" rx="4"/> -->
    <!-- 強調色塊: <rect fill="#004098"/> -->
    <!-- 圓點列表: <circle r="5" fill="#004098"/> -->
    <!-- 分隔線: <line stroke="#E0E0E0" stroke-width="1"/> -->

    <!-- 底部裝飾線 -->
    <rect x="0" y="716" width="1280" height="4" fill="#004098" />

    <!-- 頁碼 -->
    <text x="1220" y="705" text-anchor="end" font-family="Arial, sans-serif" font-size="14"
        fill="#999999">{{PAGE_NUM}}</text>

</svg>
